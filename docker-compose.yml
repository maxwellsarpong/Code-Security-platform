version: '3.8'
services:
  api:
    build: .
    # links:
    #   - "redis"
    #   - "db"
    #   - "worker"

    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/dev.db
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./src:/app/src:cached
      - ./.data:/data
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  worker:
    build: .
    command: python -m app.worker
    depends_on:
      - redis
      - api
    environment:
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
      - WORKER_METRICS_PORT=${WORKER_METRICS_PORT}
      - SENTRY_DSN=${SENTRY_DSN}
      - SCAN_PARALLELISM=${SCAN_PARALLELISM}
      - PYTHONPATH=/app/src
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          memory: 512M
    ports:
      - "9100:9100"
    volumes:
      - ./src:/app/src:cached
      - ./.data:/data
    env_file: .env

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: svc
      POSTGRES_PASSWORD: svcpass
      POSTGRES_DB: scp
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
